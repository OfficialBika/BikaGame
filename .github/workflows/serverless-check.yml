name: serverless-migration-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/telegram-serverless]

jobs:
  check-serverless-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check existing application syntax and engines
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run check
          node -e "require('./src/games/slotEngine'); require('./src/games/blackjackEngine'); require('./src/games/diceEngine'); require('./src/games/shanEngine'); console.log('legacy game engines OK')"

      - name: Parse Telegram Serverless ESM modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find tgcloud -type f -name '*.js' -print0)

      - name: Check the Serverless runtime contract
        run: node scripts/check-serverless-contract.mjs

      - name: Ensure legacy production runtime was not edited by this migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --exit-code "$base" HEAD -- index.js package.json render.yaml src
