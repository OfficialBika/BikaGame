name: ci

on:
  pull_request:
    branches: [main, feat/db-two-bot, fix/db-two-ledger-startup-retention]
  push:
    branches: [main, feat/db-two-bot, feat/db-two-ledger-authoritative, fix/db-two-ledger-startup-retention]

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Run project syntax check
        run: npm run check

      - name: Check public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Smoke-test pure game engines
        run: |
          node -e "require('./src/games/slotEngine'); require('./src/games/blackjackEngine'); require('./src/games/diceEngine'); require('./src/games/shanEngine'); console.log('game engines OK')"

      - name: Verify runtime-critical modules load
        env:
          BOT_TOKEN: ci-test
          MONGO_URI: mongodb://127.0.0.1:27017/bika_ci
          MONGO_URI_2: mongodb://127.0.0.1:27018/bika_ci_history
          DB_TWO_ENABLED: "true"
          DB_TWO_NAME: bika_ci_history
          OWNER_ID: "1"
        run: |
          node -e "require('./src/config/database'); require('./src/services/gameHistoryRetentionService'); require('./src/services/transactionService'); require('./src/services/economyService'); console.log('DB2 runtime modules load OK')"
          node -e "require('./src/utils/helpers'); require('./src/middlewares/maintenance'); require('./src/middlewares/groupApproval'); require('./src/services/broadcastService'); require('./src/commands/admin/broadcast'); console.log('middleware/broadcast modules OK')"
