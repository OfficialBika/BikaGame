name: ci

on:
  pull_request:
    branches: [main, feat/db-two-bot, feat/miniapp-v2-android]
  push:
    branches: [main, feat/db-two-bot, feat/miniapp-v2-android]

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Run project syntax check
        run: npm run check

      - name: Check public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Check Mini App v2 entry, assets, and preview safety
        run: |
          node --check public/miniapp/v2/v2.js
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('public/miniapp/v2/index.html', 'utf8');
          const js = fs.readFileSync('public/miniapp/v2/v2.js', 'utf8');
          const css = fs.readFileSync('public/miniapp/v2/v2.css', 'utf8');
          const gameCss = fs.readFileSync('public/miniapp/v2/game-ui.css', 'utf8');
          for (const file of ['v2.css?v=12', 'game-ui.css?v=5', 'v2.js?v=10', 'rocket-reference.svg?v=1']) assert.ok(html.includes(file), 'missing v2 asset reference: ' + file);
          for (const screen of ['home', 'games', 'activity', 'wallet', 'profile', 'game']) assert.ok(html.includes('data-screen="' + screen + '"'), 'missing screen: ' + screen);
          for (const tab of ['home', 'games', 'activity', 'wallet', 'profile']) assert.ok(html.includes('data-nav="' + tab + '"'), 'missing navigation: ' + tab);
          for (const nodeId of ['v2Toast', 'mainContent', 'gameSearch', 'gameEmpty', 'demoBetAmount', 'demoBetHint', 'activityEmptyTitle', 'activityEmptyText', 'maxDemoBet', 'demoBetButton', 'demoFeedback', 'profileShortcut', 'profileName', 'profileStatus', 'profileAvatar', 'connectionState', 'bikaSplash', 'bikaSplashStatus', 'lobbyMultiplier', 'lobbyBalance', 'gameBalance', 'sheetBalance', 'gameConnectionLabel', 'countdownLabel', 'multiplierHistory', 'crashPointLabel', 'liveBadge', 'previewConnectionNote', 'demoMultiplier', 'demoMultiplierValue', 'gameArena', 'gameTitle', 'gameModeLabel', 'arenaCountdown', 'countdownValue', 'arenaRocket', 'arenaTrail', 'arenaResult', 'arenaCrashBurst', 'wheelGraphic', 'wheelDisc', 'openBetSheet', 'betSheet', 'closeBetSheet', 'betSheetBackdrop', 'gameQuickAdd', 'gameConnectionButton', 'gameSettingsButton']) {
            assert.ok(html.includes('id="' + nodeId + '"'), 'missing referenced node: ' + nodeId);
          }
          assert.ok(css.includes('prefers-reduced-motion'), 'reduced-motion support missing');
          assert.ok(css.includes('env(safe-area-inset-bottom)'), 'safe-area support missing');
          assert.ok(js.includes("api('/api/mini/crash/status')"), 'live status API integration missing');
          assert.ok(js.includes("api('/api/mini/crash/bet'"), 'live bet API integration missing');
          assert.ok(js.includes("api('/api/mini/crash/cashout')"), 'live cashout API integration missing');
          assert.ok(js.includes('X-Telegram-Init-Data'), 'Telegram auth header missing');
          assert.ok(js.includes("api('/api/mini/crash/status')"), 'live crash status integration missing');
          assert.ok(js.includes("api('/api/mini/crash/bet'"), 'live crash bet integration missing');
          assert.ok(js.includes("api('/api/mini/crash/cashout')"), 'live crash cashout integration missing');
          assert.ok(js.includes('X-Telegram-Init-Data'), 'Telegram init data auth header missing');
          assert.ok(js.includes('finishSplash()'), 'BIKA startup splash completion missing');
          assert.ok(html.includes('rocket-reference.svg?v=1'), 'reference rocket sprite missing');
          assert.ok(html.includes('bikaSplash'), 'BIKA startup splash missing');
          assert.ok(gameCss.includes('.arena-countdown-ring'), 'reference-style arena UI missing');
          assert.ok(gameCss.includes('.arena-crash-burst'), 'crash burst animation missing');
          assert.ok(gameCss.includes('.bika-splash'), 'BIKA startup splash styles missing');
          assert.ok(js.includes("api('/api/mini/crash/status')"), 'server-driven crash round loop missing');
          console.log('Mini App v2 preview smoke checks OK');
          NODE

      - name: Smoke-test pure game engines
        run: |
          node -e "require('./src/games/slotEngine'); require('./src/games/blackjackEngine'); require('./src/games/diceEngine'); require('./src/games/shanEngine'); console.log('game engines OK')"

      - name: Verify critical middleware/modules load
        run: |
          BOT_TOKEN=ci-test MONGO_URI=mongodb://127.0.0.1:27017/bika_ci OWNER_ID=1 node -e "require('./src/utils/helpers'); require('./src/middlewares/maintenance'); require('./src/middlewares/groupApproval'); require('./src/services/broadcastService'); require('./src/commands/admin/broadcast'); console.log('middleware/broadcast modules OK')"

      - name: Verify DB1 cleanup script syntax
        run: node --check scripts/clear-db1-transactions.js

      - name: Verify transaction history migration script syntax
        run: node --check scripts/migrate-transaction-history.js

      - name: Verify DB2 history modules load
        run: |
          BOT_TOKEN=ci-test MONGO_URI=mongodb://127.0.0.1:27017/bika_ci MONGO_URI_2=mongodb://127.0.0.1:27018/bika_ci_history DB_TWO_ENABLED=true DB_TWO_NAME=bika_ci_history OWNER_ID=1 node -e "require('./src/config/database'); require('./src/services/webBetHistoryService'); require('./src/services/gameHistoryRetentionService'); require('./src/services/transactionService'); console.log('DB2 history modules OK')"
