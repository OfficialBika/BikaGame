name: Serverless V2 checks
on:
  push:
    branches: [SeverLess-V2-Bot]
  pull_request:
    branches: [SeverLess-V2-Bot, main]
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Serverless JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
          done < <(find tgcloud -type f -name '*.js' -print | sort)
          node --check scripts/check-serverless-v2.mjs
          node --check scripts/test-game-control-names.mjs
          node --check scripts/test-game-command-parser.mjs
          node --check scripts/test-dice-settlement-plan.mjs
          node --check scripts/test-group-approval-policy.mjs
          node --check scripts/test-broadcast-policy.mjs
          node --check scripts/test-wallet-policy.mjs
          node --check scripts/test-two-d-policy.mjs
          node --check scripts/test-stars-policy.mjs
          node --check scripts/test-daily-policy.mjs
          node --check scripts/test-maintenance-policy.mjs
      - name: Test per-game control command parsing
        run: node scripts/test-game-control-names.mjs
      - name: Test slash and dot game command parser
        run: node scripts/test-game-command-parser.mjs
      - name: Test atomic duel settlement plan
        run: node scripts/test-dice-settlement-plan.mjs
      - name: Test group approval policy
        run: node scripts/test-group-approval-policy.mjs
      - name: Test broadcast policy and worker wiring
        run: node scripts/test-broadcast-policy.mjs
      - name: Test wallet ID policy
        run: node scripts/test-wallet-policy.mjs
      - name: Test 2D rules and Yangon schedule policy
        run: node scripts/test-two-d-policy.mjs
      - name: Test Stars payment record validation
        run: node scripts/test-stars-policy.mjs
      - name: Test Yangon daily claim policy
        run: node scripts/test-daily-policy.mjs
      - name: Test maintenance mode ON/OFF policy
        run: node scripts/test-maintenance-policy.mjs
      - name: Test actual SQLite ledger triggers
        run: python3 scripts/test-dice-ledger-triggers.py
      - name: Test sports, auction and shop atomic ledger triggers
        run: python3 scripts/test-event-market-triggers.py
      - name: Check V2 contracts
        run: node scripts/check-serverless-v2.mjs
